# Every external version lives here (`catalogMode: strict`). After editing it,
# run `pnpm install` and commit pnpm-lock.yaml.
catalogMode: strict

# "." is listed so Changesets counts the root package as a workspace package.
packages:
  - "."
  - examples/ripgrep

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # The devcontainers CLI, for the `check:devcontainer` task.
  "@devcontainers/cli": ^0.90.0
  "@effect/language-service": ^0.87.5
  # For the `effect/cli` jq example only. Moves with `effect`.
  "@effect/platform-node-shared": 4.1.4
  # Moves with `@typescript/native` and vite-plus's oxlint: read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs first.
  "@effect/tsgo": 0.69.0
  # Libraries built on this package, for the downstream benchmarks only. Pinned
  # exact; the override below runs them on this checkout's build.
  "@thomasfosterau/effect-bib": 0.2.1
  "@thomasfosterau/effect-ext": 0.3.1
  "@thomasfosterau/effect-ical": 0.1.0
  "@thomasfosterau/effect-rdf": 0.3.1
  "@thomasfosterau/effect-xml": 0.3.0
  "@types/node": ^26.6.5
  # Must equal vite-plus's vitest.
  "@vitest/coverage-istanbul": 5.1.0
  "@enfect/oxlint": ^0.10.0
  effect: 4.1.4
  fallow: 3.44.0
  rolldown: ^1.2.14
  # TS6 for JS-API consumers (the language service, `vp pack`'s declarations);
  # TS7 (`@typescript/native`, bin `tsc`) type-checks and must match @effect/tsgo.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` follow vite-plus: after bumping it, run
  # `vp dlx --package=vite-plus@<v> vp migrate --no-interactive`.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0

# Published peer ranges. Raise `effect` only when a dependency requires it
# (a breaking change).
catalogs:
  peers:
    effect: ^4.0.0

# Don't keep the `minimumReleaseAgeExclude` entries `vp migrate` adds.
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  effect: "catalog:"
  "@thomasfosterau/effect-parse": "workspace:*"
nodeLinker: hoisted
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]
