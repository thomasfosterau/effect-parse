name: Auto-assign

# Assigns every pull request to the owner, so it shows in their queue.
# `pull_request` (never `pull_request_target`): the job needs nothing from the
# base repository beyond the token's own scope, checks out no code and runs no
# third-party action, so there is nothing here for a fork's PR to subvert (a
# fork's token is read-only, and the step then fails without effect).
# Dependabot's PRs are assigned by `assignees:` in .github/dependabot.yml: its
# `pull_request` runs get a read-only token, so they are skipped here.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the single job grants only what the edit needs.
permissions: {}

jobs:
  assign:
    name: Assign the owner
    if: github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.assignees.*.login, 'thomasfosterau')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
