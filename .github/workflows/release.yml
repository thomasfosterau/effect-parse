name: Release

# Changesets release flow, as in the owner's other Effect libraries: on every
# push to `trunk`, changesets/action either opens/updates the "chore: version
# packages" PR (while unreleased changesets exist) or, once that PR has merged
# and no changesets remain, publishes the package to npm via OIDC trusted
# publishing and tags the release. There is no NPM_TOKEN; see PUBLISHING.md.

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never runs on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf), and never
    # as Dependabot: the trigger is push-to-trunk only, so a Dependabot branch
    # cannot reach it, and the actor guard keeps it that way if a trigger is
    # ever added.
    if: github.repository == 'thomasfosterau/effect-parse' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: publishing waits for a required reviewer.
    environment: release
    permissions:
      contents: write # push the version tag and the version PR branch
      pull-requests: write # open/update the version PR
      id-token: write # OIDC: prove this workflow's identity to npm
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs WITH
      # lifecycle scripts, ignoring the `--ignore-scripts` of the install step
      # below. That re-install would run the root `prepare` (`vp config` +
      # `effect-tsgo patch`) and every `allowBuilds` dependency's build script
      # inside this job, which holds `id-token: write`. It triggers whenever a
      # manifest's mtime moves after the install step, e.g. when the Changesets
      # action checks out `changeset-release/trunk` and resets it before
      # `pnpm run version`. pnpm 11 reads only the `pnpm_config_*` spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] the version PR push needs these credentials
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by package.json's `packageManager`.
      # Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job. It also skips this package's
      # own `prepare` (git hooks + the tsc/oxlint patch), neither of which the
      # `vp pack` build needs. It only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see `env`).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # npm >= 11.5.1 performs the OIDC exchange for `npm publish` of the
      # tarball scripts/release.sh packs. Pinned exactly, so this job runs a
      # reviewed version; bump it by hand.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0 # zizmor: ignore[adhoc-packages] pinned exactly; npm itself, not a project dependency

      - name: Build
        run: pnpm exec vp run build

      # While changesets are pending this opens/updates the version PR (via
      # `pnpm run version`). Once that PR has merged it runs `pnpm run
      # release` (scripts/release.sh): `pnpm pack` (which rewrites
      # `catalog:peers` to the published range) and `npm publish` of the
      # tarball, which runs no lifecycle script; then `changeset tag`, whose
      # "New tag:" lines the action uses to push the tag and create the
      # GitHub release. No `--provenance`: npm attaches it by itself under
      # trusted publishing once the repository is public, and an explicit
      # request from a private repository fails the publish.
      #
      # v2 of the action pairs with Changesets CLI v3.
      - name: Create version PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
