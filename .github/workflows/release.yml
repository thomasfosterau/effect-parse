name: Release

# Changesets, split so only publishing waits for approval: `select` picks the
# mode, `version` opens the "chore: version packages" PR, `build` packs the
# tarball with a read-only token, and `publish` (the only job in the protected
# `release` environment with `id-token: write`) publishes that tarball to npm
# through trusted publishing, running no dependency code. See PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

env:
  # Stops `pnpm run` re-installing with lifecycle scripts after the
  # `--ignore-scripts` install.
  pnpm_config_verify_deps_before_run: "false"

jobs:
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-parse' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  # Everything that executes dependency code runs here, with no publishing
  # rights, so a compromised dev dependency has no OIDC token to ask for.
  build:
    name: Build the release tarball
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
      - run: vp run check:dist
      # `pnpm pack` rewrites `catalog:peers` to the published range; it has no
      # `--ignore-scripts` flag, so the setting is passed as config. The notes
      # are this version's CHANGELOG.md section, for the GitHub release.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-artifact
          pnpm pack --config.ignore-scripts=true --pack-destination release-artifact
          tarball="$(cd release-artifact && ls ./*.tgz)"
          tarball="${tarball#./}"
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > release-artifact/notes.md
          {
            echo "name=$name"
            echo "version=$version"
            echo "tarball=$tarball"
            echo "sha256=$(sha256sum "release-artifact/$tarball" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7

  # No checkout, install, `vp` or cache: it publishes the tarball `build` packed.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # release tags and GitHub releases
      id-token: write # npm trusted publishing
    env:
      NAME: ${{ needs.build.outputs.name }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release
          path: release-artifact
      - name: Check the tarball is the one that was built
        run: echo "$SHA256  release-artifact/$TARBALL" | sha256sum --check --strict
      # npm >= 11.5.1 performs the OIDC exchange.
      - run: npm install -g npm@11.20.0 --ignore-scripts # zizmor: ignore[adhoc-packages] npm itself, pinned
      # A tarball spec runs no lifecycle script. Skips a version already on npm,
      # so a re-run after a partial failure carries on to the release.
      - name: Publish to npm
        run: |
          set -euo pipefail
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip: $NAME@$VERSION is already published"
          else
            npm publish "release-artifact/$TARBALL" --access public
          fi
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "skip: the release v$VERSION already exists"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-artifact/notes.md
          fi
