name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-parse' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    # Never runs on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf), and never
    # as Dependabot: the trigger is push-to-trunk only, so a Dependabot branch
    # cannot reach it, and the actor guard keeps it that way if a trigger is
    # ever added.
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Protected environment: publishing waits for a required reviewer.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs WITH
      # lifecycle scripts, ignoring the `--ignore-scripts` of the install step
      # below. That re-install would run the root `prepare` (`vp config` +
      # `effect-tsgo patch`) and every `allowBuilds` dependency's build script
      # inside this job, which holds `id-token: write`. It triggers whenever a
      # manifest's mtime moves after the install step, e.g. when the Changesets
      # action checks out `changeset-release/trunk` and resets it before
      # `pnpm run version`. pnpm 11 reads only the `pnpm_config_*` spelling.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Installs the pnpm version pinned by package.json's `packageManager`.
      # Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          # A pinned major (the `engines` floor), never `latest`, which
          # setup-node resolves to pre-releases too: publish on a stable Node.
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job. It also skips this package's
      # own `prepare` (git hooks + the tsc/oxlint patch), neither of which the
      # `vp pack` build needs. It only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see `env`).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # npm >= 11.5.1 performs the OIDC exchange for `npm publish` of the
      # tarball scripts/release.sh packs. Pinned exactly, so this job runs a
      # reviewed version; bump it by hand.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0 # zizmor: ignore[adhoc-packages] pinned exactly; npm itself, not a project dependency

      - name: Build
        run: pnpm exec vp run build

      # While changesets are pending this opens/updates the version PR (via
      # `pnpm run version`). Once that PR has merged it runs `pnpm run
      # release` (scripts/release.sh): `pnpm pack` (which rewrites
      # `catalog:peers` to the published range) and `npm publish` of the
      # tarball, which runs no lifecycle script; then `changeset tag`, whose
      # "New tag:" lines the action uses to push the tag and create the
      # GitHub release. No `--provenance`: npm attaches it by itself under
      # trusted publishing once the repository is public, and an explicit
      # request from a private repository fails the publish.
      #
      # v2 of the action pairs with Changesets CLI v3.
      - name: Create version PR or publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
