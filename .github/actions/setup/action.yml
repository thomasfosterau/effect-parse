# Composite setup shared by every CI job that needs the toolchain.
# voidzero-dev/setup-vp installs the Vite+ CLI (`vp`, at the catalog's
# `vite-plus` pin, which it reads from package.json and pnpm-workspace.yaml),
# the Node.js that Vite+ resolves for the project (`engines.node` in
# package.json) and the pnpm that `packageManager` pins, and restores the pnpm
# store cache keyed on pnpm-lock.yaml. It replaces pnpm/action-setup and
# actions/setup-node (#111). Dependencies are then installed with a frozen
# lockfile (retried: see the Install step's own comment for why).
#
# `vp` is on PATH afterwards, and it delegates to this checkout's own
# `vite-plus`, so callers run `vp …` directly. node_modules/.bin is
# deliberately NOT appended to $GITHUB_PATH: that would let any dependency's
# bin shadow a system command (`git`, `node`, …) in every later step (zizmor
# `github-env`).
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+ (vp, Node.js and pnpm), restore the package cache, and install dependencies.
inputs:
  node-version:
    description: >
      The Node.js to install (`lts`, `latest` or a version), passed to
      setup-vp. Empty: the version Vite+ resolves for the project.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # An exact release tag, never the moving `v1` (frozen at v1.15.0).
    # `run-install: false`: the step below installs, with its retry.
    - name: Setup Vite+ (vp, Node.js, pnpm)
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        cache: true
        run-install: false
        node-version: ${{ inputs.node-version }}

    # Retried: pnpm's linker can race itself when a package with a build
    # script resolves twice and both copies build — a transient ENOENT on the
    # rename of a `_tmp_<pid>_<hex>` staging directory, seen in gardeneria CI
    # on cold-store runs (see effect-drizzle-ext's copy of this action). Every
    # attempt keeps `--frozen-lockfile` and install scripts, so a
    # deterministic failure (lockfile drift, a policy violation) still fails
    # all three.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
