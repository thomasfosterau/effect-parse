# Groups exist only for sets that must move together. The by-hand steps are in
# docs/CONTRIBUTING.md (Dependencies).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vitest and oxlint exactly; `effect-tsgo patch` supports
      # only the oxlint / tsc versions its components table lists.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
    assignees:
      - thomasfosterau

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    assignees:
      - thomasfosterau
