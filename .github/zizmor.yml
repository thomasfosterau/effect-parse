# zizmor (GitHub Actions static analysis) configuration. Run it with
# `uvx zizmor .github`; it reads this file from .github/ by itself.
rules:
  # The owner's supply-chain wait is pnpm's `minimumReleaseAge` (8 hours);
  # Dependabot's cooldown is the smallest whole unit above it, 1 day.
  # zizmor's default asks for 7.
  dependabot-cooldown:
    config:
      days: 1
